  <style>
    :root {
      --card-width: clamp(156px, 20vw, 264px);
      --card-height: calc(var(--card-width) * 1.3);
      --cyan: #7ee8ff;
      --ink: #080a10;
      --muted: #aabac8;
      --glass-border: rgba(213, 245, 255, 0.18);
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    * { box-sizing: border-box; }

    html { background: var(--ink); }

    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      color: #f4f8fb;
      font-family: "DM Sans", sans-serif;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    .coverflow-stage:focus-visible {
      outline: 2px solid #8deaff;
      outline-offset: 5px;
    }

    .app-shell {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .app-shell::before,
    .app-shell::after {
      position: absolute;
      z-index: -1;
      pointer-events: none;
      content: "";
    }

    .app-shell::before {
      top: -270px;
      left: 50%;
      width: min(920px, 100vw);
      height: 540px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse, rgba(52, 135, 183, 0.35) 0%, rgba(16, 31, 53, 0.11) 44%, transparent 73%);
      filter: blur(12px);
    }

    .app-shell::after {
      bottom: -26%;
      left: -10%;
      width: 120%;
      height: 54%;
      background: radial-gradient(ellipse, rgba(30, 126, 151, 0.16), transparent 68%);
      filter: blur(20px);
    }

    .studio-grid {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.28;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent 84%);
    }

    .page-header {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 0;
      text-align: center;
      animation: rise-in 800ms var(--ease) both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      width: 24px;
      height: 1px;
      background: currentColor;
      content: "";
      opacity: 0.75;
    }

    .hero-title {
      margin: 0;
      font-family: "Fraunces", serif;
      line-height: 1.05;
      letter-spacing: -0.045em;
    }

    .hero-copy {
      max-width: 590px;
      margin: 14px auto 0;
      line-height: 1.6;
    }

    .carousel-area {
      position: relative;
      display: grid;
      flex: 1;
      min-height: 530px;
      place-items: center;
      padding: 20px 18px 44px;
      animation: rise-in 900ms 110ms var(--ease) both;
    }

    .coverflow-stage {
      position: relative;
      width: min(1040px, 100%);
      height: 455px;
      perspective: 1250px;
      perspective-origin: 50% 43%;
      cursor: grab;
      touch-action: pan-y;
      user-select: none;
    }

    .coverflow-stage.is-dragging { cursor: grabbing; }

    .floor-glow {
      position: absolute;
      bottom: 13px;
      left: 50%;
      width: min(700px, 92%);
      height: 114px;
      border-radius: 50%;
      pointer-events: none;
      transform: translateX(-50%) rotateX(68deg);
      background: radial-gradient(ellipse, rgba(64, 221, 255, 0.23), rgba(28, 91, 124, 0.08) 44%, transparent 72%);
      filter: blur(9px);
    }

    .coverflow-track {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    .cover-card {
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--card-width);
      height: var(--card-height);
      overflow: hidden;
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      background: #101620;
      box-shadow:
        0 2px 0 rgba(255,255,255,.1) inset,
        0 0 0 1px rgba(120,220,255,.04),
        0 14px 32px rgba(0,0,0,.42),
        0 42px 72px rgba(0,0,0,.38);
      cursor: pointer;
      transform-style: preserve-3d;
      transition:
        transform 720ms var(--ease),
        opacity 580ms ease,
        filter 580ms ease;
      will-change: transform, opacity;
      -webkit-box-reflect: below 9px linear-gradient(to bottom, rgba(255,255,255,.16), rgba(255,255,255,0) 34%);
    }

    .cover-card::before {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      border-radius: inherit;
      background: linear-gradient(105deg, rgba(255,255,255,.22), transparent 27%);
      content: "";
      opacity: .9;
    }

    .cover-card::after {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      border-radius: inherit;
      background: linear-gradient(to top, rgba(0,0,0,.73), transparent 50%);
      content: "";
    }

    .cover-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      filter: saturate(.84) contrast(1.06) brightness(.75);
      transform: scale(1.03);
      transition: transform 700ms var(--ease), filter 700ms ease;
    }

    .cover-card.is-active img {
      filter: saturate(1.08) contrast(1.04) brightness(1);
      transform: scale(1.07);
    }

    .cover-card:hover img {
      transform: scale(1.1);
    }

    .caption {
      position: absolute;
      right: 11px;
      bottom: 11px;
      left: 11px;
      z-index: 3;
      padding: 11px 12px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 13px;
      background: rgba(7, 12, 18, .47);
      box-shadow: 0 8px 25px rgba(0,0,0,.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .caption-kicker {
      display: block;
      margin-bottom: 3px;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .caption-title {
      display: block;
      letter-spacing: -.015em;
    }

    .navigation {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 30;
      display: flex;
      width: min(840px, 100%);
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .nav-button {
      display: inline-grid;
      width: 47px;
      height: 47px;
      place-items: center;
      border: 1px solid rgba(196,240,255,.25);
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(0,0,0,.24), inset 0 1px rgba(255,255,255,.1);
      cursor: pointer;
      pointer-events: auto;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 220ms ease, background 220ms ease, border-color 220ms ease;
    }

    .nav-button:hover {
      border-color: rgba(134,233,255,.8);
      transform: scale(1.08);
    }

    .nav-button:active { transform: scale(.95); }

    .arrow-icon {
      width: 10px;
      height: 10px;
      border-top: 2px solid currentColor;
      border-right: 2px solid currentColor;
    }

    .arrow-left {
      transform: rotate(-135deg);
      margin-left: 4px;
    }

    .arrow-right {
      transform: rotate(45deg);
      margin-right: 4px;
    }

    .pagination {
      position: absolute;
      bottom: 26px;
      left: 50%;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 9px;
      transform: translateX(-50%);
    }

    .pagination-dot {
      width: 8px;
      height: 8px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      transition: width 330ms var(--ease), transform 220ms ease, opacity 220ms ease;
    }

    .pagination-dot:hover { transform: scale(1.25); }

    .pagination-dot.is-active {
      width: 27px;
      opacity: 1 !important;
    }

    .instruction {
      position: absolute;
      bottom: 0;
      left: 50%;
      display: flex;
      width: max-content;
      max-width: calc(100% - 36px);
      align-items: center;
      gap: 8px;
      margin: 0;
      padding: 7px 13px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      background: rgba(255,255,255,.025);
      letter-spacing: .025em;
      text-align: center;
      transform: translateX(-50%);
    }

    .drag-glyph {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: #7ee8ff;
      font-size: 14px;
      line-height: 1;
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      :root { --card-width: clamp(150px, 51vw, 208px); }

      .page-header {
        width: min(1120px, calc(100% - 30px));
        padding-top: 25px;
      }

      .carousel-area {
        min-height: 478px;
        padding-right: 12px;
        padding-left: 12px;
      }

      .coverflow-stage { height: 405px; }

      .navigation { width: 100%; }

      .nav-button {
        width: 40px;
        height: 40px;
      }

      .pagination { bottom: 28px; }
      .instruction { bottom: -2px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const stage = document.getElementById("coverflow-stage");
      const cards = Array.from(document.querySelectorAll(".cover-card"));
      const dots = Array.from(document.querySelectorAll(".pagination-dot"));
      const previousButton = document.getElementById("previous-button");
      const nextButton = document.getElementById("next-button");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let activeIndex = 0;
      let startX = 0;
      let isDragging = false;
      let wheelLocked = false;

      function circularDistance(index) {
        let distance = index - activeIndex;
        const half = cards.length / 2;

        if (distance > half) distance -= cards.length;
        if (distance < -half) distance += cards.length;

        return distance;
      }

      function renderCoverflow() {
        cards.forEach((card, index) => {
          const distance = circularDistance(index);
          const absoluteDistance = Math.abs(distance);
          const direction = distance < 0 ? -1 : 1;

          let transform = "";
          let opacity = "0";
          let zIndex = "1";
          let pointerEvents = "none";

          if (distance === 0) {
            transform = "translate(-50%, -50%) translateX(0px) translateZ(80px) rotateY(0deg) scale(1.15)";
            opacity = "1";
            zIndex = "20";
            pointerEvents = "auto";
          } else if (absoluteDistance === 1) {
            const x = direction * 205;
            const rotation = direction < 0 ? 45 : -45;
            transform = `translate(-50%, -50%) translateX(${x}px) translateZ(-150px) rotateY(${rotation}deg) scale(.91)`;
            opacity = ".6";
            zIndex = "12";
            pointerEvents = "auto";
          } else if (absoluteDistance === 2) {
            const x = direction * 350;
            const rotation = direction < 0 ? 52 : -52;
            transform = `translate(-50%, -50%) translateX(${x}px) translateZ(-275px) rotateY(${rotation}deg) scale(.75)`;
            opacity = ".28";
            zIndex = "7";
          } else {
            const x = direction * 455;
            const rotation = direction < 0 ? 58 : -58;
            transform = `translate(-50%, -50%) translateX(${x}px) translateZ(-390px) rotateY(${rotation}deg) scale(.62)`;
            opacity = ".08";
            zIndex = "2";
          }

          card.style.transform = transform;
          card.style.opacity = opacity;
          card.style.zIndex = zIndex;
          card.style.pointerEvents = pointerEvents;
          card.classList.toggle("is-active", distance === 0);
          card.setAttribute("aria-hidden", distance === 0 ? "false" : "true");

          const selected = index === activeIndex;
          dot.classList.toggle("is-active", selected);

        activeIndex = (index + cards.length) % cards.length;

        setActive(activeIndex + direction);
      }

      cards.forEach((card, index) => {
        card.addEventListener("click", () => {
          if (!isDragging) setActive(index);
        });
      });

      dots.forEach((dot, index) => {
        dot.addEventListener("click", () => setActive(index));
      });

      previousButton.addEventListener("click", () => move(-1));
      nextButton.addEventListener("click", () => move(1));

      stage.addEventListener("wheel", (event) => {
        event.preventDefault();

        if (wheelLocked) return;
        if (Math.abs(event.deltaY) < 8 && Math.abs(event.deltaX) < 8) return;

        wheelLocked = true;
        move(event.deltaY > 0 || event.deltaX > 0 ? 1 : -1);

        window.setTimeout(() => {
          wheelLocked = false;

      }, { passive: false });

      stage.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "mouse" && event.button !== 0) return;

        isDragging = false;
        startX = event.clientX;
        stage.setPointerCapture(event.pointerId);
        stage.classList.add("is-dragging");
      });

      stage.addEventListener("pointermove", (event) => {
        if (!stage.hasPointerCapture(event.pointerId)) return;
        if (Math.abs(event.clientX - startX) > 8) isDragging = true;
      });

      function endDrag(event) {
        if (!stage.hasPointerCapture(event.pointerId)) return;

        const distance = event.clientX - startX;
        stage.releasePointerCapture(event.pointerId);
        stage.classList.remove("is-dragging");

        if (Math.abs(distance) > 36) {
          move(distance < 0 ? 1 : -1);
        }

        window.setTimeout(() => {
          isDragging = false;
        }, 0);
      }

      stage.addEventListener("pointerup", endDrag);
      stage.addEventListener("pointercancel", endDrag);

      stage.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          move(-1);
        }

        if (event.key === "ArrowRight") {
          event.preventDefault();
          move(1);
        }
      });

      renderCoverflow();
    });
  </script>
 </body>
</html>
